name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Vosk Russian model
        run: |
          mkdir -p app/src/main/assets/model-ru
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip
          cp -r vosk-model-small-ru-0.22/* app/src/main/assets/model-ru/
          echo "model-ru-$(date +%s)" > app/src/main/assets/model-ru/uuid

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VoicePrompter-APK
          path: app/build/outputs/apk/debug/app-debug.apk
